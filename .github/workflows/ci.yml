name: Test application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch source archive at the event commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          archive="$RUNNER_TEMP/nounarchive-source.tar.gz"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            --output "$archive"
      - name: Select a compatible runner-cached Node.js
        shell: bash
        run: bash .github/scripts/select-node.sh
      - run: npm ci
      - run: npm run cf:db:local
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
