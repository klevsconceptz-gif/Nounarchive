name: Test application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch source archive at the event commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          archive="$RUNNER_TEMP/nounarchive-source.tar.gz"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            --output "$archive"
      - name: Select or bootstrap the required Node.js runtime
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          selector="$GITHUB_WORKSPACE/.github/scripts/select-node.sh"
          if [[ ! -r "$selector" ]]; then
            echo "::error::Node runtime selector is missing from the fetched source archive: $selector"
            exit 1
          fi
          source "$selector"
      - run: npm ci
        working-directory: ${{ github.workspace }}
      - run: npm run cf:db:local
        working-directory: ${{ github.workspace }}
      - run: npm test
        working-directory: ${{ github.workspace }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ github.workspace }}
