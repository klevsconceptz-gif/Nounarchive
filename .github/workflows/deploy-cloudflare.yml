name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Web deployment target (choose one)
        required: true
        type: choice
        options: [worker, pages]
permissions:
  contents: read
# Serialize production changes and migrations; never cancel a migration in flight.
concurrency:
  group: nounarchive-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/bf9d8ef8-nounarchive'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.CLOUDFLARE_ADMIN_PASSWORD_HASH }}
        run: |
          node --input-type=module - <<'JS'
          for (const name of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','D1_DATABASE_ID','ADMIN_PASSWORD_HASH']) {
            if (!process.env[name]) throw new Error('Missing production environment setting: '+name);
          }
          if (!/^pbkdf2-sha256\$100000\$[a-f0-9]{64}\$[a-f0-9]{64}$/.test(process.env.ADMIN_PASSWORD_HASH)) throw new Error('Invalid admin password hash format.');
          JS
          npm run cf:configure -- "$D1_DATABASE_ID"
      - name: Back up D1 and apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export nounarchive --remote --output data/d1-backup.sql
          npm run cf:db:remote
      - name: Deploy full Worker and set admin secret
        if: github.event_name == 'push' || inputs.target == 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.CLOUDFLARE_ADMIN_PASSWORD_HASH }}
        run: |
          npm run cf:deploy
          printf '%s' "$ADMIN_PASSWORD_HASH" | npx wrangler secret put ADMIN_PASSWORD_HASH
      - name: Set Pages secret, deploy Pages and deploy scheduler
        if: inputs.target == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.CLOUDFLARE_ADMIN_PASSWORD_HASH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          printf '%s' "$ADMIN_PASSWORD_HASH" | npx wrangler pages secret put ADMIN_PASSWORD_HASH --project-name nounarchive
          npm run pages:deploy -- --branch "$DEPLOY_BRANCH"
          npm run cf:deploy:scheduler
